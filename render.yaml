services:
  - type: web
    name: blast-mcp
    runtime: docker
    region: oregon
    plan: free
    rootDir: packages/mcp-subject-data
    dockerfilePath: ./Dockerfile
    envVars:
      - key: PORT
        value: "8080"
      - key: SHADOW_DB_NAME
        value: blast_shadow
      - key: MCP_AUTH_TOKEN
        sync: false
      - key: DATABASE_URL
        sync: false
    healthCheckPath: /healthz
    autoDeploy: true
    branch: feature/real-backend-vercel